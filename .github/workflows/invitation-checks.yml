name: Ayapark Invitation Checks

on:
  pull_request:
    paths:
      - '**/*.mjs'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/invitation-checks.yml'
  push:
    branches:
      - feature/whatsapp-invites-20261026

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax validation
        run: |
          node --check app.mjs
          node --check api.mjs
          node --check people-ui.mjs
          node --check invite-ui.mjs
      - name: Full JavaScript regression suite
        run: npm test
