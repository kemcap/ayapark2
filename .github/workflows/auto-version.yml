name: Auto version AYAPARK 2
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      level:
        description: "Version change"
        required: true
        type: choice
        options: [patch, minor, major]
permissions:
  contents: write
concurrency:
  group: ayapark2-version-main
  cancel-in-progress: false
jobs:
  bump:
    if: github.event_name == 'workflow_dispatch' || (!startsWith(github.event.head_commit.message, 'chore(release):') && !startsWith(github.event.head_commit.message, 'chore(version):'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detect release level
        id: level
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          MANUAL_LEVEL: ${{ inputs.level }}
        run: |
          if [ -n "$MANUAL_LEVEL" ]; then
            echo "value=$MANUAL_LEVEL" >> "$GITHUB_OUTPUT"
          elif echo "$MESSAGE" | grep -Eq 'BREAKING CHANGE|^[a-z]+(\([^)]+\))?!:'; then
            echo "value=major" >> "$GITHUB_OUTPUT"
          elif echo "$MESSAGE" | grep -Eq '^feat(\([^)]+\))?:'; then
            echo "value=minor" >> "$GITHUB_OUTPUT"
          else
            echo "value=patch" >> "$GITHUB_OUTPUT"
          fi
      - name: Update product version
        run: node scripts/version/bump.mjs "${{ steps.level.outputs.value }}"
      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json index.html
          git commit -m "chore(release): automatically bump product version"
          git push
