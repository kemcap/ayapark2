name: AYAPARK 2 official release
on:
  workflow_dispatch:
    inputs:
      level:
        description: "Semantic version increment for a verified release"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
permissions:
  contents: write
concurrency:
  group: ayapark2-official-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run application unit tests
        run: npm test
      - name: Bump product version exactly once
        run: node scripts/version/bump.mjs "${{ inputs.level }}"
      - name: Validate release and create tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          git fetch --tags
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag already exists: $TAG"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json index.html
          git commit -m "chore(release): AYAPARK 2 $TAG"
          git push origin HEAD:main
          git tag -a "$TAG" -m "AYAPARK 2 $TAG"
          git push origin "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Publish GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "AYAPARK 2 $TAG" --generate-notes --verify-tag
