name: Ayapark Invitation Checks

on:
  pull_request:
    paths:
      - '**/*.mjs'
      - 'supabase/**'
      - '**/*.css'
      - '**/*.html'
      - 'tests/**'
      - 'scripts/import/**'
      - 'vendor/**'
      - 'package*.json'
      - '.github/workflows/invitation-checks.yml'
  push:
    branches:
      - feature/whatsapp-invites-20261026

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax validation
        run: |
          node --check app.mjs
          node --check bank-file-reader.mjs
          node --check bank-file-adapters.mjs
          node --check bank-xlsx-worker.mjs
          node --check api.mjs
          node --check people-ui.mjs
          node --check invite-ui.mjs
          node --check site-claims-ui.mjs
          node --check supabase/functions/ay3-site-open-claims/math.mjs
      - name: Verify pinned local import parsers
        run: |
          npm run build:import-parsers
          git diff --exit-code -- vendor
      - name: Full JavaScript regression suite
        run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck Supabase Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/ay3-whatsapp-invite/index.ts
      - name: Typecheck site claims Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/ay3-site-open-claims/index.ts
      - name: Typecheck verified phone login (development only)
        run: deno check --node-modules-dir=auto supabase/functions/ay3-password-login/index.ts
      - name: Isolated auth database checks
        run: |
          npm run test:auth:sql
          npm run test:invite:sql
      - name: Typecheck access requests
        run: deno check --node-modules-dir=auto supabase/functions/ay3-access-requests/index.ts
      - name: Access request SQL checks
        run: npm run test:requests:sql
      - name: Typecheck administrative recovery
        run: deno check --node-modules-dir=auto supabase/functions/ay3-admin-recovery/index.ts
      - name: Isolated recovery SQL checks
        run: npm run test:recovery:sql
      - name: Integrated auth SQL checks
        run: npm run test:integration:sql
      - name: Existing finance and permission SQL checks
        run: |
          npm run test:sql
          npm run test:v5:sql
      - name: Personal history and invitations SQL checks
        run: npm run test:people:sql
      - name: Current task rights, contact approvals and history SQL checks
        run: |
          npm run test:rights:sql
          npm run test:contacts:sql
          npm run test:history:sql
      - name: Read-only bank statement inspection checks
        run: python3 -m unittest discover -s tests -p test_bank_statement_inspection.py
      - name: Current financial integration SQL checks
        run: |
          npm run test:finance:sql
          npm run test:finance:audit:sql
          npm run test:bank:sql
      - name: Safe Edge Function smoke checks (no resident data)
        run: node tests/invite-edge-smoke.mjs
      - name: Safe site receivables smoke checks (no resident data)
        run: node tests/site-claims-edge-smoke.mjs
