name: AyaPark 2 Phase 1 synthetic restore (no real data)
on:
  pull_request:
    branches:
      - feature/free-backup-preparation-20261028
    paths:
      - ".github/workflows/phase1-synthetic-restore.yml"
      - "scripts/backup/**"

permissions:
  contents: read

jobs:
  synthetic-restore:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pull request safely
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install free local tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends age
      - name: Shell scripts syntax (no production access)
        run: |
          bash -n scripts/backup/backup.sh
          bash -n scripts/backup/test_synthetic_restore.sh
      - name: Offline Python tests and complete synthetic archive (no real data)
        run: python3 -B -m unittest discover -s scripts/backup -p 'test_*.py' -v
      - name: PG17 age roundtrip, isolated restore and RLS
        run: bash scripts/backup/test_synthetic_restore.sh
