name: Dashboard reconciliation targeted checks
on:
  pull_request:
    paths:
      - 'app.mjs'
      - 'v3-ui.mjs'
      - 'finance-forms.mjs'
      - 'tests/dashboard-reconciliation.test.mjs'
      - '.github/workflows/dashboard-reconciliation-checks.yml'
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check app.mjs && node --check v3-ui.mjs && node --check finance-forms.mjs
      - run: node --test tests/dashboard-reconciliation.test.mjs tests/overview-account-summary.test.mjs tests/unit-finance-dashboard.test.mjs tests/v5.test.mjs
